# DEBUG: True

BASE_LOG_DIR: results/statopt2/resnet_test

LARGE_BATCH: 128  # batch for fwd-bkwd pass
SMALL_BATCH: 128  # batch for one forward pass
BASE_LR: 0.05
EPOCHS: 100
VAL_STEP: 25000
USE_TTA_EVAL: False

model:
  type: ResNet18_kuangliu

opt:
  type: SGD
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  # SELECTION_METHOD: 'tvalue2'
  # LR_GROW: 0.01
  # LR_SHRINK: 0.01

scheduler:
  type: CosineAnnealingLR
  LR_MIN: 0.001
  BY_EPOCH: True

LABEL_SMOOTH: 0 #.2
CLIP_PROB: false